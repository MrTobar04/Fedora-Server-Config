{
  "Dhcp6": {
    "interfaces-config": {
      "interfaces": ["enp0s8"]
    },
    "lease-database": {
      "type": "memfile",
      "lfc-interval": 3600
    },
    "subnet6": [
      {
        "id": 1,
        "subnet": "2001:db7:dea:a::/64",
        "pools": [
          { "pool": "2001:db7:dea:a::100-2001:db7:dea:a::200" }
        ],
        "interface": "enp0s8", 
        "option-data": [
          { "name": "dns-servers", "data": "2001:db7:dea:a::2" },
          { "name": "domain-search", "data": "semita.sv" }
        ]
      }
    ],
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000
  }
}